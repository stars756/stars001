# ============================================================
# BaykeShop docker-compose.yml
# 服务编排：PostgreSQL 15 + Redis 7 + Django(Gunicorn) + Celery Worker/Beat
#
# 使用方式:
#   开发环境:  docker compose up -d          (默认用 dev profile)
#   生产环境:  docker compose --profile prod up -d
# ============================================================

version: "3.8"

services:

  # ==================== 数据库：PostgreSQL 15 ====================
  postgres:
    image: postgres:15-alpine
    container_name: baykeshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-baykeuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-baykepass123}
      POSTGRES_DB: ${POSTGRES_DB:-baykeshop}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-baykeuser} -d ${POSTGRES_DB:-baykeshop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ==================== 缓存 & 消息队列：Redis 7 ====================
  redis:
    image: redis:7-alpine
    container_name: baykeshop-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  # ==================== Web 服务：Django + Gunicorn ====================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baykeshop-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 数据库连接（容器内通过服务名访问）
      DATABASE_URL: postgres://${POSTGRES_USER:-baykeuser}:${POSTGRES_PASSWORD:-baykepass123}@postgres:5432/${POSTGRES_DB:-baykeshop}
      # Redis 连接
      REDIS_URL: redis://redis:6379/0
      # Celery Broker
      CELERY_BROKER_URL: redis://redis:6379/1
      # 关闭 DEBUG（生产环境）
      DEBUG: "false"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/static
      - logs_data:/app/logs
    command: >
      gunicorn project.wsgi:application
        --bind 0.0.0.0:8000
        --workers ${GUNICORN_WORKERS:-3}
        --worker-class gthread
        --threads ${GUNICORN_THREADS:-4}
        --access-logfile -
        --error-logfile -
        --log-level info
        --timeout 120
        --graceful-timeout 30
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/schema/"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - backend

  # ==================== Celery Worker（异步任务处理） ====================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baykeshop-celery-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-baykeuser}:${POSTGRES_PASSWORD:-baykepass123}@postgres:5432/${POSTGRES_DB:-baykeshop}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - logs_data:/app/logs
    command: >
      celery -A project.celery:app worker
        --loglevel=info
        --concurrency=${CELERY_CONCURRENCY:-4}
        --queues=default,email,sms,periodic
        --hostname=worker@%h
    networks:
      - backend

  # ==================== Celery Beat（定时任务调度） ====================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baykeshop-celery-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-baykeuser}:${POSTGRES_PASSWORD:-baykepass123}@postgres:5432/${POSTGRES_DB:-baykeshop}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - beat_schedule:/app/var/celery  # Beat 调度状态持久化
      - logs_data:/app/logs
    command: >
      celery -A project.celery:app beat
        --loglevel=info
        --scheduler django_celery_beat.schedulers:DatabaseScheduler
    networks:
      - backend

  # ==================== 生产环境额外服务 ====================

  # 数据库备份（仅 prod profile 启动，每日凌晨 2:00）
  backup:
    profiles: ["prod"]
    image: postgres:15-alpine
    container_name: baykeshop-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      DB_USER: ${POSTGRES_USER:-baykeuser}
      PGPASSWORD: ${POSTGRES_PASSWORD:-baykepass123}
      DB_NAME: ${POSTGRES_DB:-baykeshop}
      RETENTION_DAYS: 7
    volumes:
      - ./scripts:/scripts:ro
      - backups_data:/app/backups
      - media_data:/app/media:ro
    entrypoint: /bin/sh
    command: |
      -c "
      while true; do
        sleep \$(( \$(date -d 'tomorrow 02:00' +\%s) - \$(date +\%s) ))
        /scripts/backup.sh
        sleep 86400
      done
      "
    depends_on:
      - postgres
    networks:
      - backend

  # Nginx 反向代理（仅 prod profile 启动）
  nginx:
    profiles: ["prod"]
    image: nginx:alpine
    container_name: baykeshop-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/usr/share/nginx/static:ro
      - media_data:/usr/share/nginx/media:ro
      - cert_data:/etc/nginx/certs:ro
    depends_on:
      - web
    networks:
      - backend


# ==================== 持久化卷 ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
  static_data:
    driver: local
  logs_data:
    driver: local
  beat_schedule:
    driver: local
  cert_data:
    driver: local
  backups_data:
    driver: local


# ==================== 网络 ====================
networks:
  backend:
    driver: bridge
