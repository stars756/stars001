<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ subject }}</title>
</head>
<body>
    <div style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
        <h2 style="color: #333;">您好 {{ username }}，</h2>
        <p>请点击以下按钮验证您的邮箱：</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ verification_url }}" style="background-color: #4CAF50; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; font-size: 16px;">验证邮箱</a>
        </div>
        <p>或者复制以下链接到浏览器地址栏中访问：</p>
        <p style="background-color: #f5f5f5; padding: 10px; border-radius: 4px; word-break: break-all;">{{ verification_url }}</p>
        <p><small>此链接24小时内有效。</small></p>
        <p><small>如果您没有请求验证邮箱，请忽略此邮件。</small></p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="color: #777; font-size: 12px;">感谢使用我们的服务！<br>baykeShop团队</p>
    </div>
</body>
</html>
