{% extends 'baykeshop/member/profile.html' %}

{% load i18n %}

{% block profile_header %}
    <h1 class="bk-is-size-4">
        <span class="bk-icon"><i class="mdi mdi-lock-reset"></i></span>
        {{ title }}
    </h1>
{% endblock %}

{% block profile_content %}
<div class="p-6">
<form class="bk-form" method="post">
    {% csrf_token %}
    {{ form.as_bulma }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="bk-field bk-is-grouped bk-is-grouped-right">
        <div class="bk-control">
            <a class="bk-button bk-is-light" href="{% url 'member:profile' %}">
              <span class="bk-icon"><i class="mdi mdi-arrow-left"></i></span>
              <span>{% translate '取消' %}</span>
            </a>
        </div>
        <div class="bk-control">
          <button class="bk-button bk-is-link" type="submit">
            <span class="bk-icon"><i class="mdi mdi-content-save-all-outline"></i></span>
            <span>{% translate '确认修改' %}</span>
          </button>
        </div>
    </div>
</form>
</div>

<script>
console.log('=== SMS Verification Button Script START ===');

// 确保在Vue.js等框架之后执行
setTimeout(function() {
    console.log('SMS verification button script executing...');

    // 查找短信验证码输入字段
    const smsCodeInput = document.getElementById('id_sms_code');
    console.log('Found SMS code input by ID:', smsCodeInput);

    if (!smsCodeInput) {
        console.log('ERROR: Could not find SMS code input field with id="id_sms_code"');
        return;
    }

    // 创建发送验证码按钮
    const sendButton = document.createElement('button');
    sendButton.type = 'button';
    sendButton.className = 'button is-link is-small mt-1';
    sendButton.textContent = '发送验证码';
    sendButton.id = 'send-sms-btn';
    console.log('Created button:', sendButton);

    // 创建按钮容器
    const buttonContainer = document.createElement('div');
    buttonContainer.className = 'mt-1';
    buttonContainer.appendChild(sendButton);

    // 找到输入框的父容器
    const inputContainer = smsCodeInput.closest('.field, .bk-field, .control, .bk-control');
    console.log('Input container found:', inputContainer);

    if (inputContainer) {
        // 将按钮容器插入到输入框后面
        inputContainer.appendChild(buttonContainer);
        console.log('Button inserted into container');
    } else {
        // 备用方案：直接插入到输入框后面
        smsCodeInput.parentNode.insertBefore(buttonContainer, smsCodeInput.nextSibling);
        console.log('Button inserted after input (fallback)');
    }

    // 倒计时状态
    let countdown = 0;
    let countdownInterval = null;

    // 更新按钮状态
    function updateButtonState() {
        if (countdown > 0) {
            sendButton.disabled = true;
            sendButton.textContent = `重新发送(${countdown}s)`;
            sendButton.className = 'button is-light is-small mt-1';
        } else {
            sendButton.disabled = false;
            sendButton.textContent = '发送验证码';
            sendButton.className = 'button is-link is-small mt-1';
        }
    }

    // 开始倒计时
    function startCountdown(seconds) {
        countdown = seconds;
        updateButtonState();

        if (countdownInterval) {
            clearInterval(countdownInterval);
        }

        countdownInterval = setInterval(() => {
            countdown--;
            updateButtonState();

            if (countdown <= 0) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
        }, 1000);
    }

    // 显示消息提示
    function showMessage(message, isSuccess = true) {
        // 移除现有消息
        const existingMessage = buttonContainer.querySelector('.message');
        if (existingMessage) {
            existingMessage.remove();
        }

        // 创建新消息
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isSuccess ? 'is-success' : 'is-danger'} is-small mt-1`;
        messageDiv.innerHTML = `
            <div class="message-body">
                ${message}
            </div>
        `;
        buttonContainer.appendChild(messageDiv);

        // 3秒后自动移除
        setTimeout(() => {
            if (messageDiv.parentNode) {
                messageDiv.remove();
            }
        }, 3000);
    }

        // 添加点击事件
        sendButton.addEventListener('click', function() {
            console.log('=== Send SMS Button Clicked ===');

            // 如果正在倒计时，不执行
            if (countdown > 0) {
                console.log('Button is in countdown, skipping');
                return;
            }

            // 禁用按钮防止重复点击
            sendButton.disabled = true;
            sendButton.textContent = '发送中...';
            console.log('Button disabled and text changed to "发送中..."');

            // 获取CSRF token
            const csrfInput = document.querySelector('[name=csrfmiddlewaretoken]');
            console.log('CSRF input element:', csrfInput);

            if (!csrfInput) {
                console.error('ERROR: CSRF token input not found!');
                showMessage('系统错误: 找不到CSRF token', false);
                sendButton.disabled = false;
                sendButton.textContent = '发送验证码';
                return;
            }

            const csrfToken = csrfInput.value;
            console.log('CSRF token (first 10 chars):', csrfToken.substring(0, 10) + '...');

            // 发送AJAX请求
            console.log('Sending POST request to /api/send-sms/');
            console.log('Request headers:', {
                'X-CSRFToken': csrfToken.substring(0, 10) + '...',
                'Content-Type': 'application/json'
            });
            console.log('Request body:', {operation_type: 'general'});

            fetch('/api/send-sms/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({operation_type: 'general'})
            })
            .then(response => {
                console.log('Response status:', response.status, response.statusText);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('API response data:', data);
                if (data.code === 0) {
                    console.log('API success: verification code sent');
                    showMessage('验证码已发送，请查收短信', true);
                    // 开始60秒倒计时
                    startCountdown(60);
                } else {
                    console.log('API error:', data.msg);
                    showMessage('发送失败: ' + data.msg, false);
                    // 恢复按钮状态
                    sendButton.disabled = false;
                    sendButton.textContent = '发送验证码';
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                showMessage('请求失败: ' + error.message, false);
                // 恢复按钮状态
                sendButton.disabled = false;
                sendButton.textContent = '发送验证码';
            });
        });

    console.log('=== SMS Verification Button Script END - Button should be visible ===');
}, 100); // 延迟100ms确保在Vue之后执行
</script>
{% endblock %}
