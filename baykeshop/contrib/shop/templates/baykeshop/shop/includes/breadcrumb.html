{% load i18n %}
<nav class="bk-breadcrumb bk-has-arrow-separator px-3 py-2" aria-label="breadcrumbs">
    <ul>
        <li><a href="{% url 'shop:index' %}">{% translate '首页' %}</a></li>
        {% for item in breadcrumbs %}
        <li {% if forloop.last %}class="bk-is-active"{% endif %}>
            {% if item.url and not forloop.last %}
            <a href="{{ item.url }}">{{ item.name }}</a>
            {% else %}
            <span>{{ item.name }}</span>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
</nav>
