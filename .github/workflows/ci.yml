name: BaykeShop CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: project.settings
          SECRET_KEY: ci-test-secret-key
          DEBUG: 'True'
          ALLOWED_HOSTS: localhost
          DB_NAME: shop_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379
        run: |
          python -m pytest tests/ -v --tb=short --cov=baykeshop --cov-report=term --cov-report=xml --cov-fail-under=30 \
            -k "not (test_auto_close_restores_stock or test_paid_to_refunded or test_unpaid_to_expired or test_unpaid_to_paid or test_unpaid_to_refunded or test_unpaid_to_shipped or test_unpaid_to_verify)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check baykeshop/ --select=E,F --ignore=E501,E402,F401,F403,F405,F841,E701

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: pip install bandit safety
      - name: Bandit SAST
        run: |
          bandit -r baykeshop/ -x "*/migrations/*,*/tests/*" \
            --severity-level high \
            --confidence-level high
      - name: Safety dependency scan
        run: |
          safety check -r requirements.txt --save-json safety-report.json || true
        continue-on-error: true

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shop_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install Django>=4.2 psycopg2-binary python-decouple
          pip install -r requirements.txt
          pip install -e ./baykeshop
      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: project.settings
          SECRET_KEY: ci-migration-check
          DB_NAME: shop_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: localhost
          DB_PORT: 5432
        run: python manage.py makemigrations --check --dry-run
